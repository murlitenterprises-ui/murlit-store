<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — Murlit Enterprises</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #fdf6ee;
      color: #1a1009;
      font-family: 'Segoe UI', system-ui, sans-serif;
      text-align: center;
      padding: 1.5rem;
    }
    h1 { font-size: 2rem; color: #7c1d1d; margin-bottom: 0.5rem; }
    p  { color: #6b5b3e; max-width: 36ch; line-height: 1.6; }
    button {
      margin-top: 1.5rem;
      padding: 0.6rem 1.4rem;
      border-radius: 6px;
      border: 2px solid #7c1d1d;
      background: transparent;
      color: #7c1d1d;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #7c1d1d; color: #fdf6ee; }
  </style>
</head>
<body>
  <h1>You're Offline</h1>
  <p>It looks like you don't have an internet connection right now. Please check your network and try again.</p>
  <button onclick="window.location.reload()">Try Again</button>
</body>
</html>
